# Local Postgres for the API and the backend integration suite.
# Published on 5433 so it does not collide with a host Postgres on 5432.
# Container name matches `docker start quotesnap-db`.
services:
  postgres:
    image: postgres:16
    container_name: quotesnap-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quotesnap
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotesnap"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - quotesnap-pg:/var/lib/postgresql/data

volumes:
  quotesnap-pg:
