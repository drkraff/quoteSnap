name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck --workspace=apps/backend

      - name: Typecheck mobile
        run: npm run typecheck --workspace=apps/mobile

      - name: Lint mobile
        run: npm run lint --workspace=apps/mobile

      - name: Test backend
        run: npm run test --workspace=apps/backend

      - name: Test mobile
        run: npm run test --workspace=apps/mobile
