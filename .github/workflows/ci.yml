name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck --workspace=apps/backend

      - name: Typecheck mobile
        run: npm run typecheck --workspace=apps/mobile

      - name: Lint mobile
        run: npm run lint --workspace=apps/mobile

      - name: Test backend
        run: npm run test --workspace=apps/backend

      - name: Test mobile
        run: npm run test --workspace=apps/mobile

  # Real Postgres 16 (same major as Railway). Does not replace the `ci` job.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quotesnap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quotesnap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quotesnap
      JWT_ACCESS_SECRET: integration-test-jwt-secret-32-chars-min
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations on an empty database
        run: |
          set -o pipefail
          npm run migrate --workspace=apps/backend 2>&1 | tee migrate-first.log
          files=$(find apps/backend/src/db/migrations -name '*.sql' | wc -l | tr -d ' ')
          applied=$(grep -c 'Applied migration:' migrate-first.log || true)
          test "$applied" = "$files"
          grep -q 'Applied migration: 001_foundation.sql' migrate-first.log
          grep -q 'Applied migration: 022_quote_client_key.sql' migrate-first.log
          grep -q 'Applied migration: 023_quote_snapshot_delete.sql' migrate-first.log
          grep -q 'Migrations complete.' migrate-first.log

      - name: Re-run migrations
        run: |
          set -o pipefail
          npm run migrate --workspace=apps/backend 2>&1 | tee migrate-rerun.log
          files=$(find apps/backend/src/db/migrations -name '*.sql' | wc -l | tr -d ' ')
          skipped=$(grep -c 'Skipping already-applied migration:' migrate-rerun.log || true)
          applied=$(grep -c 'Applied migration:' migrate-rerun.log || true)
          test "$skipped" = "$files"
          test "$applied" = "0"
          grep -q 'Skipping already-applied migration: 001_foundation.sql' migrate-rerun.log
          grep -q 'Skipping already-applied migration: 022_quote_client_key.sql' migrate-rerun.log
          grep -q 'Skipping already-applied migration: 023_quote_snapshot_delete.sql' migrate-rerun.log
          grep -q 'Migrations complete.' migrate-rerun.log

      - name: Integration tests
        run: npm run test:integration --workspace=apps/backend
